# Nightly DISHA MIS backup.
# Every night at 02:00 India time this asks the live site to save a full
# database backup into Backblaze B2. Reading the database also stops the
# free Supabase project from pausing.
#
# Needs two repository secrets (Settings › Secrets and variables › Actions):
#   APP_URL      https://disha-mis-eiec.onrender.com
#   CRON_SECRET  the same value as CRON_SECRET in Render
name: Nightly backup

on:
  schedule:
    - cron: "30 20 * * *"   # 20:30 UTC = 02:00 IST
  workflow_dispatch:         # "Run workflow" button for a test run

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the site
        # The free Render plan sleeps; the first request can take a minute
        run: curl -sS --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 -o /dev/null "${{ secrets.APP_URL }}/health"
      - name: Save backup
        run: |
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 180 \
            -X POST -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/cron/nightly"
