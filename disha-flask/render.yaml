services:
  - type: web
    name: disha-mis
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Private server key (service_role). Needed before running supabase_lockdown.sql
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Backblaze B2 file storage and backups
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_ENDPOINT
        sync: false
      # Shared with the nightly backup GitHub Action
      - key: CRON_SECRET
        sync: false
