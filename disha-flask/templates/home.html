<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DISHA MIS</title>
<link rel="icon" href="{{ url_for('static', filename=C.LOGO_FILE) }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="home-body">
<header class="home-top">
  <div class="home-brand">
    <img src="{{ url_for('static', filename=C.LOGO_FILE) }}" alt="DISHA logo" class="home-logo">
    <div class="home-org" data-t>{{ C.ORG_NAME }}</div>
  </div>
  <div class="lang-switch">
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
    <button class="lang-btn" data-lang="bn" onclick="setLang('bn')">বাংলা</button>
  </div>
</header>

<main class="home-main">
  <h1 class="home-welcome" data-t>Welcome to the DISHA MIS System</h1>
  <p class="home-lead" data-t>Select a section to continue</p>

  <div class="section-grid">
    {% for s in C.SECTIONS %}
      {% if s.active %}
      <a class="section-card active" href="{{ url_for('fisheries') }}">
        <div class="section-icon">{{ s.icon }}</div>
        <div class="section-name" data-t>{{ s.name }}</div>
        <span class="section-status status-active" data-t>Enter →</span>
      </a>
      {% else %}
      <div class="section-card soon" aria-disabled="true">
        <div class="section-icon">{{ s.icon }}</div>
        <div class="section-name" data-t>{{ s.name }}</div>
        <span class="section-status status-soon" data-t>Coming Soon</span>
      </div>
      {% endif %}
    {% endfor %}
  </div>
</main>

<footer class="home-foot">© {{ today.year }} <span data-t>{{ C.ORG_NAME }}</span></footer>

<script src="{{ url_for('static', filename='js/i18n_bn.js') }}"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
